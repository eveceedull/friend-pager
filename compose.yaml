# Local development only. All passwords/signing material here are PUBLIC FIXTURES.
# No .env setup, host SDK, Docker socket mount, or hosted Supabase project required.
name: friend-pager
x-password: &password friend-pager-compose-local-db-password
x-jwt-secret: &jwt-secret friend-pager-compose-local-only-signing-secret-v1
services:
  db:
    image: ghcr.io/supabase/postgres:17.11.0.006
    environment:
      POSTGRES_PASSWORD: *password
      POSTGRES_DB: postgres
      JWT_EXP: '3600'
    command: [postgres, -c, config_file=/etc/postgresql/postgresql.conf, -c, log_min_messages=warning]
    volumes:
      - database:/var/lib/postgresql/data
      - database-config:/etc/postgresql-custom
      - ./docker/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-compose-roles.sql:ro
    ports:
      - '127.0.0.1:54322:5432'
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -h, localhost]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  mailpit:
    image: ghcr.io/supabase/mailpit:v1.31.3
    ports:
      - '127.0.0.1:54324:8025'
    restart: unless-stopped
  auth:
    image: ghcr.io/supabase/gotrue:v2.197.0
    depends_on:
      db: {condition: service_healthy}
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: '9999'
      API_EXTERNAL_URL: http://127.0.0.1:54321
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:friend-pager-compose-local-db-password@db:5432/postgres
      GOTRUE_SITE_URL: http://localhost:7357
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: 'true'
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_EXTERNAL_PHONE_ENABLED: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_SECRET: *jwt-secret
      GOTRUE_JWT_EXP: '3600'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_HOST: mailpit
      GOTRUE_SMTP_PORT: '1025'
      GOTRUE_SMTP_ADMIN_EMAIL: local-admin@example.test
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: 'true'
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: pg-functions://postgres/private/before_user_created
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://localhost:9999/health]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  bootstrap:
    build:
      context: .
      dockerfile: docker/bootstrap/Dockerfile
    depends_on:
      auth: {condition: service_healthy}
    environment:
      DATABASE_URL: postgres://supabase_admin:friend-pager-compose-local-db-password@db:5432/postgres
      JWT_SECRET: *jwt-secret
    volumes:
      - runtime:/runtime
    restart: 'no'
  rest:
    image: ghcr.io/supabase/postgrest:v16.5
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      PGRST_DB_URI: postgres://authenticator:friend-pager-compose-local-db-password@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: *jwt-secret
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_ADMIN_SERVER_PORT: '3001'
      PGRST_ADMIN_SERVER_HOST: 127.0.0.1
    healthcheck:
      test: [CMD, postgrest, --ready]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
  realtime:
    image: ghcr.io/supabase/realtime:v2.147.1
    volumes:
      - runtime:/runtime:ro
    healthcheck:
      test: [CMD-SHELL, 'curl --fail --silent --head -H "Authorization: Bearer $$(cat /runtime/realtime-health-key)" http://localhost:4000/api/tenants/realtime-dev/health']
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 10s
    depends_on:
      bootstrap: {condition: service_completed_successfully}
    environment:
      PORT: '4000'
      DB_HOST: db
      DB_PORT: '5432'
      DB_USER: supabase_admin
      DB_PASSWORD: *password
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: supabaserealtime
      API_JWT_SECRET: *jwt-secret
      METRICS_JWT_SECRET: *jwt-secret
      METRICS_PUSHER_ENABLED: 'false'
      TENANT_METRICS_PUSHER_ENABLED: 'false'
      SECRET_KEY_BASE: friend-pager-compose-local-only-realtime-secret-not-for-production-1234567890
      APP_NAME: realtime
      SEED_SELF_HOST: 'true'
      RUN_JANITOR: 'true'
      DISABLE_HEALTHCHECK_LOGGING: 'true'
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
    restart: unless-stopped
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    depends_on:
      bootstrap: {condition: service_completed_successfully}
      rest: {condition: service_healthy}
      realtime: {condition: service_healthy}
    volumes:
      - runtime:/runtime:ro
    ports:
      - '127.0.0.1:7357:8080'
      - '127.0.0.1:54321:8080'
    healthcheck:
      test: [CMD, wget, --quiet, --spider, http://127.0.0.1:8080/healthz]
      interval: 3s
      timeout: 5s
      retries: 40
    restart: unless-stopped
volumes:
  database:
  database-config:
  runtime:
