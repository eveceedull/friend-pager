name: Set up pinned Flutter
description: Install a fixed Flutter SDK revision without transitive actions.
runs:
  using: composite
  steps:
    - name: Install Flutter SDK
      shell: bash
      run: |
        set -euo pipefail
        sdk="$RUNNER_TEMP/friend-pager-flutter"
        git init --initial-branch=stable "$sdk"
        git -C "$sdk" remote add origin https://github.com/flutter/flutter.git
        git -C "$sdk" fetch --depth=1 origin refs/tags/3.47.8:refs/tags/3.47.8
        test "$(git -C "$sdk" rev-parse '3.47.8^{commit}')" = 737ba8f885dc774b53b442759999a312c9461e4e
        git -C "$sdk" checkout -B stable 737ba8f885dc774b53b442759999a312c9461e4e
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          cygpath -w "$sdk/bin" >> "$GITHUB_PATH"
        else
          echo "$sdk/bin" >> "$GITHUB_PATH"
        fi
        "$sdk/bin/flutter" --version
        "$sdk/bin/flutter" config --no-analytics
