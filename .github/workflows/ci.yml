name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

env:
  SUPABASE_TELEMETRY_DISABLED: "1"
  DO_NOT_TRACK: "1"

permissions:
  contents: read

jobs:
  quality:
    name: Flutter analysis and tests
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Enforce formatting
        run: dart format --output=none --set-exit-if-changed lib test test_backend
      - name: Static analysis
        run: flutter analyze --fatal-infos
      - name: Widget and unit tests with coverage
        run: flutter test --coverage
      - name: Browser widget tests
        run: flutter test --platform chrome
      - name: Enforce baseline coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          data = Path('coverage/lcov.info').read_text()
          found = sum(int(line[3:]) for line in data.splitlines() if line.startswith('LF:'))
          hit = sum(int(line[3:]) for line in data.splitlines() if line.startswith('LH:'))
          assert found > 0, 'No instrumented Dart lines'
          minimum = 65
          assert 100 * hit >= minimum * found, f'Coverage {hit}/{found} is below {minimum}%'
          print(f'Coverage: {hit}/{found} lines')
          PY

  build:
    name: Build ${{ matrix.target }}
    needs: quality
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: web
            os: ubuntu-latest
            command: flutter build web --release --no-web-resources-cdn
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
          - target: windows
            os: windows-latest
            command: flutter build windows --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install Linux build dependencies
        if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Install Java for Android
        if: matrix.target == 'android'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate platform runners
        shell: bash
        run: bash tool/generate-runners.sh ${{ matrix.target }}
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build
        run: ${{ matrix.command }}

  backend:
    name: Local Supabase integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Install pinned Supabase CLI
        run: bash tool/install-supabase-ci.sh
      - name: Start isolated local stack
        run: bash tool/supabase.sh start
      - name: Rebuild database from migrations and seed
        run: bash tool/supabase.sh reset
      - name: Verify backend ports are loopback-only
        run: python3 tool/check-local-ports.py
      - name: Provision synthetic local admin and connection settings
        run: python3 tool/prepare-local.py
      - name: Test Auth, registration, RLS, session restore, revocation and rejoin
        run: flutter test --dart-define-from-file=.local/config.json test_backend
      - name: Stop local stack
        if: always()
        run: bash tool/supabase.sh stop --no-backup

  compose:
    name: Docker Compose local stack
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-flutter
      - name: Install locked Dart dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Start from a clean checkout with one Compose up command
        run: docker compose up -d --wait --wait-timeout 240
      - name: Verify public config and persistent session fixture
        run: python3 tool/compose/smoke.py
      - name: Run all backend tests against the Compose stack
        run: flutter test --dart-define-from-file=.local/compose-config.json test_backend
      - name: Install browser test tooling
        run: |
          python3 -m venv .local/compose-browser
          .local/compose-browser/bin/pip install playwright==1.55.0
      - name: Test real served web app with no external runtime requests
        run: .local/compose-browser/bin/python tool/compose/browser.py
      - name: Stop containers while preserving data
        run: docker compose down
      - name: Restart the existing data with the same command
        run: docker compose up -d --wait --wait-timeout 240
      - name: Verify session and preference persistence
        run: python3 tool/compose/smoke.py --verify-persistence
      - name: Capture diagnostics on failure
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color --tail=150
      - name: Clean up disposable Compose data
        if: always()
        run: docker compose down --volumes --remove-orphans
