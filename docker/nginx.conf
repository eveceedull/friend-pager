map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
# Only local browser origins may make cross-origin requests to the API port.
map $http_origin $local_origin {
    default '';
    ~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$ $http_origin;
}
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    add_header Access-Control-Allow-Origin $local_origin always;
    add_header Access-Control-Allow-Headers 'authorization,apikey,content-type,x-client-info,x-supabase-api-version' always;
    add_header Access-Control-Allow-Methods 'GET,POST,PATCH,DELETE,OPTIONS' always;
    if ($request_method = OPTIONS) { return 204; }
    location = /healthz { access_log off; return 200 'ok'; }
    location = /local-config.json {
        alias /runtime/local-config.json;
        add_header Cache-Control 'no-store';
    }
    location /auth/v1/ {
        proxy_pass http://auth:9999/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /rest/v1/ {
        proxy_pass http://rest:3000/;
        proxy_set_header Host $host;
        proxy_set_header Prefer $http_prefer;
    }
    location /realtime/v1/api/ { proxy_pass http://realtime:4000/api/; }
    location /realtime/v1/ {
        proxy_pass http://realtime:4000/socket/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host realtime-dev.localhost;
        proxy_read_timeout 65s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
